name: Integración continua de Android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Pruebas y compilación
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # El paquete heredado "tools" fue retirado del repositorio de Android SDK
      # (15/09/2026). setup-android lo instala por defecto y falla, así que
      # pedimos explícitamente solo lo que necesita el proyecto.
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos al wrapper
        run: chmod +x ./gradlew

      - name: Pruebas unitarias
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug --console=plain

      - name: Publicar informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore

      - name: Publicar APK de depuración
        uses: actions/upload-artifact@v4
        with:
          name: ParFMI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
